spring:
  config:
    import: optional:file:.env[.properties]
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/civictrack}
    username: ${DB_USERNAME:civictrack}
    password: ${DB_PASSWORD:civictrack}
  jpa:
    hibernate.ddl-auto: validate
    open-in-view: false
  flyway:
    enabled: true
org:
  jobrunr:
    background-job-server:
      enabled: true
    dashboard:
      enabled: true
      port: 8000
app:
  jwt:
    secret: ${JWT_SECRET:change-me-to-a-long-random-secret-for-local-development}
    expiration-ms: ${JWT_EXPIRATION_MS:86400000}
  llm:
    url: ${LLM_API_URL:http://localhost:11434/api/generate}
    model: ${LLM_MODEL:llama3.1:8b}
    api-key: ${LLM_API_KEY:}
  s3:
    bucket: ${S3_BUCKET:}
    region: ${S3_REGION:ap-south-1}
    access-key: ${AWS_ACCESS_KEY_ID:}
    secret-key: ${AWS_SECRET_ACCESS_KEY:}
    endpoint: ${S3_ENDPOINT:}
logging:
  level:
    org.springframework.security: TRACE


