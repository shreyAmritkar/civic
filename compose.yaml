
services:
  postgres:
    image: postgres:16-alpine
    container_name: civictrack-postgres
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-civictrack}
      POSTGRES_USER: ${POSTGRES_USER:-civictrack}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-civictrack}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - civictrack-postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 5s
      retries: 10

  mailpit:
    image: axllent/mailpit
    container_name: civictrack-mailpit
    ports:
      - "1025:1025"   # SMTP, the app sends here
      - "8025:8025"   # Web inbox: http://localhost:8025

volumes:
  civictrack-postgres-data: